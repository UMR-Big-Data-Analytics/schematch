name: Framework checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_project.py
      - run: python tools/audit_matchers.py --check
      - run: python tools/audit_dataset_sources.py --check
      - run: python -m unittest discover -s tools/tests -v
      - run: mvn -B -ntp test compile dependency:build-classpath '-Dmdep.outputFile=target/cp.txt'
      - run: python tools/run_schematch.py
